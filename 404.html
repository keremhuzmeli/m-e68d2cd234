<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Erişim Kısıtlı</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0B1F3A; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .box { background: #fff; color: #0B1F3A; max-width: 380px; padding: 28px; border-radius: 16px; border-top: 4px solid #D4A017; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0; font-size: 14px; color: #475569; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Yetkili Davet Linki Gerekli</h1>
    <p>Bu sayfaya yalnızca paylaşılan geçerli davet bağlantısı üzerinden erişilebilir.</p>
  </div>
</body>
</html>
